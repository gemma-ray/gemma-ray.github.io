<!-- ========================================
     PÀGINA D'ENTRADA
     EDIT HERE: per canviar la contrasenya, vegeu login.js
     ======================================== -->
<main class="login" id="login">
  <div class="login__sea" aria-hidden="true"></div>
  <div class="login__glow" aria-hidden="true"></div>

  <svg class="login__deco login__deco--l" viewBox="0 0 320 130" aria-hidden="true"><use href="#e-olive"></use></svg>
  <svg class="login__deco login__deco--r" viewBox="0 0 320 130" aria-hidden="true"><use href="#e-olive"></use></svg>

  <div class="login__card" id="loginCard">
    <div class="login__frame" aria-hidden="true">
      <svg class="login__corner login__corner--tl"><use href="#i-corner"></use></svg>
      <svg class="login__corner login__corner--tr"><use href="#i-corner"></use></svg>
      <svg class="login__corner login__corner--bl"><use href="#i-corner"></use></svg>
      <svg class="login__corner login__corner--br"><use href="#i-corner"></use></svg>
    </div>

    <p class="login__place">Blanes · Costa Brava</p>
    <h1 class="login__names">Gemma <i class="amp">&amp;</i> Ray</h1>
    <p class="login__date">14 · 05 · 27</p>

    <svg class="login__rule" viewBox="0 0 300 44" aria-hidden="true"><use href="#e-flourish"></use></svg>

    <p class="login__lede">
      Aquest racó és només per a la gent que estimem.
      Escriviu la paraula que us vam enviar amb la invitació.
    </p>

    <form class="login__form" id="loginForm" novalidate>
      <div class="login__field">
        <label class="login__label" for="loginPass">La paraula màgica</label>
        <input class="login__input" type="password" id="loginPass" name="loginPass"
               autocomplete="current-password" autocapitalize="none"
               autocorrect="off" spellcheck="false" required
               placeholder="············" aria-describedby="loginError">
        <button class="login__peek" type="button" id="loginPeek"
                aria-pressed="false" aria-label="Mostrar la contrasenya">veure</button>
      </div>

      <p class="login__error" id="loginError" role="alert" aria-live="assertive"></p>

      <button class="btn btn--solid login__submit" type="submit" id="loginSubmit">Entrar</button>
    </form>

    <p class="login__help">
      No la trobeu? Escriviu-nos i us la tornem a enviar de seguida.
    </p>
  </div>

  <p class="login__foot">El Convent de Blanes · Divendres 14 de maig de 2027</p>
</main>
